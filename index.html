<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>위모캠 모임방</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1220;--paper:#efe6d2;--ember:#ff9a3c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:"Gowun Batang","Noto Serif KR",serif;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
.tag .say{background:#fff;color:#222;border-radius:12px;padding:5px 10px;font-size:14px;max-width:200px;text-align:center;display:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tag .nm{display:flex;align-items:center;gap:6px;background:var(--paper);color:#222;border-radius:999px;padding:3px 12px 3px 4px;font-size:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tag .nm i{font-style:normal;background:#3d4a2c;color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.tag.o .nm{padding-left:12px}
#hint,#cnt{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);font-size:14px;opacity:0;transition:opacity .5s;background:rgba(11,18,32,.7);padding:8px 12px;border-radius:8px;pointer-events:none;line-height:1.5}
#hint{left:max(14px,env(safe-area-inset-left,0px))}
#cnt{right:max(14px,env(safe-area-inset-right,0px))}
body.in #hint,body.in #cnt{opacity:.88}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:rgba(11,18,32,.92);border:1px solid #b08d57;padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;max-width:86%;text-align:center;z-index:9}
#toast.show{opacity:1}
#chat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;gap:6px;width:min(520px,calc(100% - 24px))}
body.in #chat{display:flex}
#chat input,#fwbox input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--paper);background:rgba(11,18,32,.88);border:1px solid #3a4a6e;border-radius:10px;padding:10px 12px}
button{font:inherit;color:var(--paper);background:#2a3552;border:1px solid #475a86;border-radius:10px;padding:10px 12px;cursor:pointer;font-size:15px;white-space:nowrap}
button:hover{background:#34426a}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 126px);display:none;background:#8a4f1a;border-color:var(--ember);font-size:17px;padding:12px 22px}
#act.show{display:block}
body:not(.in) #act{display:none}
#fwbox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:min(520px,calc(100% - 24px));display:none;gap:6px}
#fwbox.open{display:flex}
#fwgo{background:#7a2f55;border-color:#d96aa0}
#stick{position:fixed;left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 130px);width:110px;height:110px;border-radius:50%;background:rgba(239,230,210,.12);border:2px solid rgba(239,230,210,.3);display:none;touch-action:none}
body.in.touch #stick{display:block}
#stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(239,230,210,.55)}
#enter{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,10,20,.55);padding:16px}
body.in #enter{display:none}
.card{width:min(380px,100%);background:#141c2e;border:1px solid #3a4a6e;border-radius:14px;padding:24px 22px}
.card h1{margin:0 0 6px;font-size:30px;letter-spacing:.06em}
.card p{margin:0 0 16px;font-size:15px;line-height:1.6;opacity:.85}
.card label{display:block;font-size:14px;margin:12px 0 6px;opacity:.9}
.card input{width:100%;font:inherit;font-size:16px;color:var(--paper);background:#0b1220;border:1px solid #3a4a6e;border-radius:10px;padding:10px 12px}
.sws{display:flex;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;padding:0}
.sw[aria-checked=true]{border-color:var(--ember)}
#go{width:100%;margin-top:20px;background:#8a4f1a;border-color:var(--ember);font-size:17px}
#go:hover{background:#a05c20}
</style>
</head>
<body>
<canvas id="c" aria-label="위모캠 캠핑장 3D 화면"></canvas>
<div id="tags"></div>
<div id="hint">방향키·WASD로 이동 · 바닥을 눌러도 걸어가요 · 드래그로 시점<br>장작을 꺼내 불에 넣어보세요 (E키) · 움직이면 의자에서 일어나요</div>
<div id="cnt"></div>
<div id="toast" role="status"></div>
<button id="act" type="button"></button>
<div id="fwbox"><input id="wish" maxlength="30" placeholder="소원을 적고 폭죽을 터뜨려요" aria-label="소원"><button id="fwgo" type="button">터뜨리기</button></div>
<form id="chat" autocomplete="off">
  <input id="say" maxlength="40" placeholder="말풍선으로 한마디" aria-label="말풍선으로 한마디">
  <button>말하기</button>
  <button type="button" id="fwb">폭죽</button>
  <button type="button" id="dnb">댄스</button>
</form>
<div id="stick" aria-label="이동 조이스틱"><i></i></div>
<div id="enter">
  <div class="card">
    <h1>위모캠 모임방</h1>
    <p>캠핑장에 들어가서 캐릭터를 움직여 보세요. 같은 주소로 들어온 사람들과 P2P로 바로 연결돼 함께 만나요.</p>
    <label for="nick">캠핑장에서 쓸 이름</label>
    <input id="nick" maxlength="8" placeholder="예: 고요한 바람">
    <label id="swl">옷 색</label>
    <div class="sws" id="sws" role="radiogroup" aria-labelledby="swl"></div>
    <button id="go">캠핑장 입장</button>
  </div>
</div>

    }
    var r=remote[d.id];
    r.x=d.x;r.z=d.z;r.yaw=d.yaw;r.sit=d.sit;r.seat=d.seat;r.hasLog=d.hasLog;r.dance=d.dance;
  });

  gS(function(d){
    if(remote[d.id]){
      showBubble(remote[d.id].tagEl,d.msg);
    }
  });

  gA(function(d){
    if(d.type==="firewood"){
      boost=Math.min(boost+1,5);
      toast((d.nick||"누군가")+"님이 모닥불에 장작을 넣었습니다! 🔥");
    }else if(d.type==="firework"){
      spawnFirework(d.wish);
      toast((d.nick||"누군가")+"님의 소원: "+d.wish);
    }
  });
}

function showBubble(tagEl,msg){
  if(!tagEl)return;
  var say=tagEl.querySelector(".say");
  say.textContent=msg;say.style.display="block";
  clearTimeout(tagEl.sayTt);
  tagEl.sayTt=setTimeout(function(){say.style.display="none"},4000);
}

/* 폭죽 파티클 효과 */
var fireworks=[];
function spawnFirework(txt){
  var fg=new THREE.Group();fg.position.set(rnd(-6,6),rnd(6,10),rnd(-6,6));
  var col=new THREE.Color().setHSL(Math.random(),.9,.6);
  var pCnt=80,pArr=new Float32Array(pCnt*3),vArr=[];
  for(var k=0;k<pCnt;k++){
    pArr[k*3]=0;pArr[k*3+1]=0;pArr[k*3+2]=0;
    var theta=Math.random()*6.283,phi=Math.random()*3.1415,spd=rnd(3,8);
    vArr.push(new THREE.Vector3(Math.sin(phi)*Math.cos(theta)*spd,Math.cos(phi)*spd,Math.sin(phi)*Math.sin(theta)*spd));
  }
  var pGeo=new THREE.BufferGeometry();pGeo.setAttribute("position",new THREE.BufferAttribute(pArr,3));
  var pMat=new THREE.PointsMaterial({color:col,size:.18,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
  var pts=new THREE.Points(pGeo,pMat);fg.add(pts);S.add(fg);
  fireworks.push({group:fg,pts:pts,v:vArr,life:1,maxLife:1.5,col:col});
}

function fireworksUp(dt){
  for(var k=fireworks.length-1;k>=0;k--){
    var fw=fireworks[k];fw.life+=dt;
    var pos=fw.pts.geometry.attributes.position.array;
    for(var j=0;j<fw.v.length;j++){
      pos[j*3]+=fw.v[j].x*dt;
      pos[j*3+1]+=fw.v[j].y*dt - 2*dt; /* 중력 효과 */
      pos[j*3+2]+=fw.v[j].z*dt;
    }
    fw.pts.geometry.attributes.position.needsUpdate=true;
    fw.pts.material.opacity=1-(fw.life/fw.maxLife);
    if(fw.life>=fw.maxLife){
      S.remove(fw.group);
      fireworks.splice(k,1);
    }
  }
}

/* 입장 처리 */
var myTag=null;
$("#go").onclick=function(){
  var nk=$("#nick").value.trim()||"캠퍼"+Math.floor(Math.random()*900+100);
  me.nick=nk;
  myAvatar=createHuman(COLORS[me.cIdx]);
  S.add(myAvatar.group);
  myTag=document.createElement("div");myTag.className="tag o";
  myTag.innerHTML='<div class="say"></div><div class="nm"><span></span></div>';
  $("#tags").appendChild(myTag);
  myTag.querySelector(".nm span").textContent=me.nick;

  document.body.classList.add("in");
  initP2P();
};

/* 조작 키 처리 */
var keys={};
addEventListener("keydown",function(e){
  if(document.activeElement.tagName==="INPUT")return;
  keys[e.code]=true;
  if(e.code==="KeyE"||e.code==="KeyF")doAction();
});
addEventListener("keyup",function(e){keys[e.code]=false});

/* 터치 / 드래그 시점 & 바닥 클릭 이동 처리 */
var isDragging=false,lastX=0,lastY=0,camPitch=.35,camYaw=0,camDist=7.5;
var raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();

cv.addEventListener("pointerdown",function(e){
  if(!document.body.classList.contains("in"))return;
  isDragging=true;lastX=e.clientX;lastY=e.clientY;
});
cv.addEventListener("pointermove",function(e){
  if(!isDragging)return;
  var dx=e.clientX-lastX,dy=e.clientY-lastY;
  camYaw-=dx*.005;
  camPitch=Math.max(.1,Math.min(1.2,camPitch+dy*.005));
  lastX=e.clientX;lastY=e.clientY;
});
addEventListener("pointerup",function(e){
  if(!isDragging)return;
  isDragging=false;
  /* 드래그 거리가 매우 짧으면 바닥 클릭으로 간주 */
  if(Math.hypot(e.clientX-lastX,e.clientY-lastY)<5){
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(mouse,cam);
    var intersects=raycaster.intersectObject(gd);
    if(intersects.length>0){
      me.targetX=intersects[0].point.x;
      me.targetZ=intersects[0].point.z;
      if(me.sit)standUp(me);
    }
  }
});

/* 상호작용 (E키 / 버튼) */
var boost=0;
function doAction(){
  if(!document.body.classList.contains("in"))return;
  /* 의자 안자있으면 일어나기 */
  if(me.sit){standUp(me);toast("의자에서 일어났습니다.");return}

  var dPile=Math.hypot(me.x-PILE.x,me.z-PILE.z);
  var dFire=Math.hypot(me.x,me.z);

  /* 장작 더미 근처: 장작 집기 */
  if(dPile<1.8 && !me.hasLog){
    me.hasLog=1;
    toast("장작을 하나 들었습니다! 모닥불로 가져가세요.");
    return;
  }
  /* 모닥불 근처: 장작 넣기 */
  if(dFire<2.2 && me.hasLog){
    me.hasLog=0;
    boost=Math.min(boost+1,5);
    sendAct({type:"firewood",nick:me.nick});
    toast("불에 장작을 넣었습니다! 💥 불길이 세집니다.");
    return;
  }
  /* 빈 의자 앉기 */
  for(var k=0;k<SEATS.length;k++){
    if(Math.hypot(me.x-SEATS[k].x,me.z-SEATS[k].z)<1.2 && !seatTaken(k)){
      sitDown(me,k);
      toast("통나무 의자에 앉았습니다.");
      return;
    }
  }
}

$("#act").onclick=doAction;

/* 채팅 & 폭죽 & 댄스 */
$("#chat").onsubmit=function(e){
  e.preventDefault();
  var say=$("#say"),txt=say.value.trim();
  if(!txt)return;
  showBubble(myTag,txt);
  sendSay({id:me.id,msg:txt});
  say.value="";
};
$("#fwb").onclick=function(){$("#fwbox").classList.toggle("open")};
$("#fwgo").onclick=function(){
  var w=$("#wish").value.trim()||"모두 행복하세요!";
  spawnFirework(w);
  sendAct({type:"firework",nick:me.nick,wish:w});
  $("#wish").value="";$("#fwbox").classList.remove("open");
};
$("#dnb").onclick=function(){
  if(me.sit)standUp(me);
  me.dance=me.dance?0:1;
  toast(me.dance?"신나게 춤추는 중! 💃":"춤을 멈췄습니다.");
};

/* 캐릭터 애니메이션 조절기 */
function animateHuman(av,isMoving,isSitting,isDancing,hasLog,t){
  if(!av)return;
  if(isSitting){
    av.group.position.y=.18;
    av.legL.rotation.x=-1.3;av.legR.rotation.x=-1.3;
    av.armL.rotation.x=-.2;av.armR.rotation.x=-.2;
  }else if(isDancing){
    av.group.position.y=Math.abs(Math.sin(t*10))*.15;
    av.legL.rotation.x=Math.sin(t*10)*.5;av.legR.rotation.x=-Math.sin(t*10)*.5;
    av.armL.rotation.z=Math.cos(t*10)*.8+.4;av.armR.rotation.z=-Math.cos(t*10)*.8-.4;
    av.armL.rotation.x=0;av.armR.rotation.x=0;
  }else if(isMoving){
    av.group.position.y=Math.abs(Math.sin(t*8))*.08;
    av.legL.rotation.x=Math.sin(t*8)*.7;av.legR.rotation.x=-Math.sin(t*8)*.7;
    if(hasLog){
      av.armL.rotation.x=-1.2;av.armR.rotation.x=-1.2;
      av.armL.rotation.z=.2;av.armR.rotation.z=-.2;
    }else{
      av.armL.rotation.x=-Math.sin(t*8)*.6;av.armR.rotation.x=Math.sin(t*8)*.6;
      av.armL.rotation.z=0;av.armR.rotation.z=0;
    }
  }else{
    av.group.position.y=0;
    av.legL.rotation.x=0;av.legR.rotation.x=0;
    if(hasLog){
      av.armL.rotation.x=-1.2;av.armR.rotation.x=-1.2;
      av.armL.rotation.z=.2;av.armR.rotation.z=-.2;
    }else{
      av.armL.rotation.x=0;av.armR.rotation.x=0;
      av.armL.rotation.z=0;av.armR.rotation.z=0;
    }
  }
}

/* 태그 2D 화면 좌표 동기화 도우미 */
var vec3Temp=new THREE.Vector3();
function updateTagPos(tagEl,x,y,z){
  if(!tagEl)return;
  vec3Temp.set(x,y+1.9,z);
  vec3Temp.project(cam);
  if(vec3Temp.z>1){tagEl.style.display="none";return}
  tagEl.style.display="flex";
  var sx=(vec3Temp.x*.5+.5)*innerWidth;
  var sy=(-vec3Temp.y*.5+.5)*innerHeight;
  tagEl.style.transform="translate(-50%,-100%) translate("+sx+"px,"+sy+"px)";
}

/* 메인 루프 */
var clock=new THREE.Clock(),T=0;
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),.1);T+=dt;

  if(boost>0)boost=Math.max(0,boost-dt*.15);
  flameUp();embUp(dt);lvUp(dt);fireworksUp(dt);

  /* 플레이어 조작 계산 */
  if(document.body.classList.contains("in")){
    var moveX=0,moveZ=0;
    if(keys["ArrowUp"]||keys["KeyW"])moveZ-=1;
    if(keys["ArrowDown"]||keys["KeyS"])moveZ+=1;
    if(keys["ArrowLeft"]||keys["KeyA"])moveX-=1;
    if(keys["ArrowRight"]||keys["KeyD"])moveX+=1;

    if(moveX!==0||moveZ!==0){
      me.targetX=null;me.targetZ=null;
      if(me.sit)standUp(me);
      me.dance=0;
      /* 카메라 시점 기준 이동 */
      var headYaw=camYaw;
      var inputAngle=Math.atan2(moveX,moveZ);
      var moveAngle=headYaw+inputAngle;
      var spd=3.2;
      var nX=me.x+Math.sin(moveAngle)*spd*dt;
      var nZ=me.z+Math.cos(moveAngle)*spd*dt;
      if(!hit(nX,me.z))me.x=nX;
      if(!hit(me.x,nZ))me.z=nZ;
      me.yaw=moveAngle;
    }else if(me.targetX!==null && me.targetZ!==null){
      /* 클릭 이동 */
      var dx=me.targetX-me.x,dz=me.targetZ-me.z,dist=Math.hypot(dx,dz);
      if(dist>.2){
        var ang=Math.atan2(dx,dz);
        var cSpd=3.2;
        var cnX=me.x+Math.sin(ang)*cSpd*dt;
        var cnZ=me.z+Math.cos(ang)*cSpd*dt;
        if(!hit(cnX,me.z))me.x=cnX;
        if(!hit(me.x,cnZ))me.z=cnZ;
        me.yaw=ang;
      }else{
        me.targetX=null;me.targetZ=null;
      }
    }

    /* 내 캐릭터 3D 위치 반영 */
    if(myAvatar){
      myAvatar.group.position.set(me.x,0,me.z);
      myAvatar.group.rotation.y=me.yaw;
      var isMoving=(moveX!==0||moveZ!==0||me.targetX!==null);
      animateHuman(myAvatar,isMoving,me.sit,me.dance,me.hasLog,T);
      updateTagPos(myTag,me.x,myAvatar.group.position.y,me.z);
    }

    /* 상호작용 버튼(액션) UI 표시 업데이트 */
    var btnAct=$("#act");
    var dPile=Math.hypot(me.x-PILE.x,me.z-PILE.z),dFire=Math.hypot(me.x,me.z);
    var nearSeat=-1;
    for(var s=0;s<SEATS.length;s++){
      if(Math.hypot(me.x-SEATS[s].x,me.z-SEATS[s].z)<1.2 && !seatTaken(s)){nearSeat=s;break}
    }

    if(me.sit){
      btnAct.textContent="일어나기 (E)";btnAct.classList.add("show");
    }else if(dPile<1.8 && !me.hasLog){
      btnAct.textContent="장작 집기 (E)";btnAct.classList.add("show");
    }else if(dFire<2.2 && me.hasLog){
      btnAct.textContent="장작 넣기 (E)";btnAct.classList.add("show");
    }else if(nearSeat!==-1){
      btnAct.textContent="의자에 앉기 (E)";btnAct.classList.add("show");
    }else{
      btnAct.classList.remove("show");
    }

    /* 카메라 위치 (3인칭 추적) */
    cam.position.x=me.x + Math.sin(camYaw)*Math.cos(camPitch)*camDist;
    cam.position.y=1.2 + Math.sin(camPitch)*camDist;
    cam.position.z=me.z + Math.cos(camYaw)*Math.cos(camPitch)*camDist;
    cam.lookAt(me.x,1.2,me.z);

    /* 내 이동 정보 P2P 전송 */
    sendMove({id:me.id,nick:me.nick,cIdx:me.cIdx,x:me.x,z:me.z,yaw:me.yaw,sit:me.sit,seat:me.seat,hasLog:me.hasLog,dance:me.dance});
  }else{
    /* 시작 화면 시점 원형 회전 */
    cam.position.set(Math.cos(T*.1)*14,6,Math.sin(T*.1)*14);
    cam.lookAt(0,1,0);
  }

  /* 원격 플레이어 위치 & 애니메이션 처리 */
  for(var id in remote){
    var r=remote[id];
    if(r.avatar){
      r.avatar.group.position.set(r.x,0,r.z);
      r.avatar.group.rotation.y=r.yaw;
      animateHuman(r.avatar,false,r.sit,r.dance,r.hasLog,T);
      updateTagPos(r.tagEl,r.x,r.avatar.group.position.y,r.z);
    }
  }

  /* 동접자 수 표시 */
  var count=1+Object.keys(remote).length;
  $("#cnt").textContent="접속자: "+count+"명";

  R.render(S,cam);
}

loop();
})();
</script>
